[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vrm-ia-maker"
version = "0.1.0.dev0"
description = "Build-time CLI for compiling character design packages into validated VRM avatars for Three.js."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kathy (kathesama)" },
]
maintainers = [
    { name = "Kathy (kathesama)" },
]
keywords = [
    "vrm",
    "avatar",
    "blender",
    "threejs",
    "character-design",
    "cli",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    # Specification layer.
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "Pillow>=11,<13",
    # Legacy CLI retained during migration.
    "click>=8.1",
    # Legacy REST bridge. This dependency will become optional before removal.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Legacy MCP bridge. This dependency will become optional before removal.
    "mcp>=1.0",
    # Legacy Brúarhönd client dependency retained until the lateral feature is removed.
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/kathesama/vrm-ia-maker"
Repository = "https://github.com/kathesama/vrm-ia-maker"
Documentation = "https://github.com/kathesama/vrm-ia-maker/tree/development/docs"
Upstream = "https://github.com/hrabanazviking/Seidr-Smidja"

[project.optional-dependencies]
authoring-openai = [
    "openai>=2.30,<3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
]
# Legacy Brúarhönd daemon-side GUI automation dependencies.
brunhand-daemon = [
    "pyautogui>=0.9.54",
    "mss>=9.0.0",
    "pygetwindow>=0.0.9",
]
# Windows-only accessibility support for the legacy Brúarhönd host.
brunhand-win = [
    "pywinauto>=0.6.8 ; sys_platform == 'win32'",
]
# macOS-only accessibility support for the legacy Brúarhönd host.
brunhand-mac = [
    "pyobjc-framework-Quartz>=10.0 ; sys_platform == 'darwin'",
]
# Linux-only accessibility support for the legacy Brúarhönd host.
brunhand-linux = [
    "pyatspi>=2.38.0 ; sys_platform == 'linux'",
]

[project.scripts]
seidr = "seidr_smidja.bridges.runstafr.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_blender: marks tests that require a live Blender installation (deselect with -m 'not requires_blender')",
    "requires_vroid_host: marks tests that require a live VRoid Studio session on a reachable Brúarhönd daemon (deselect with -m 'not requires_vroid_host')",
]
addopts = "-m 'not requires_blender and not requires_vroid_host'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
