name: Temporary BOOTSTRAP-4 Python 3.11 diagnostic

on:
  push:
    branches:
      - tmp-bootstrap4-py311-debug

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with development dependencies
        run: pip install -e ".[dev]"

      - name: Capture pytest diagnostics
        id: pytest
        shell: bash
        run: |
          set +e
          pytest --tb=long -vv > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap4-py311-diagnostics
          path: pytest-output.txt
          retention-days: 1

      - name: Preserve pytest result
        if: steps.pytest.outputs.status != '0'
        run: exit 1
