name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff production gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with development dependencies
        run: pip install -e ".[dev]"

      - name: Run production Ruff gate
        run: ruff check src/vrm_ia_maker/ tests/unit/vrm_ia_maker/ tests/test_ci_policy.py

      - name: Report inherited Ruff baseline
        if: ${{ always() }}
        continue-on-error: true
        run: ruff check src/ tests/

  typecheck:
    name: mypy production gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with development dependencies
        run: pip install -e ".[dev]"

      - name: Run production mypy gate
        run: mypy src/vrm_ia_maker/

      - name: Report inherited mypy baseline
        if: ${{ always() }}
        continue-on-error: true
        run: mypy src/seidr_smidja/

  three-assembly-compiler:
    name: Three.js assembly compiler gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/three-assembly-compiler/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python production contracts
        run: pip install -e .

      - name: Install production compiler dependencies
        run: npm ci --prefix packages/three-assembly-compiler --no-audit --no-fund

      - name: Run production compiler syntax gate
        run: npm run check --prefix packages/three-assembly-compiler

      - name: Run production compiler tests
        run: npm test --prefix packages/three-assembly-compiler

  test:
    name: pytest Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with development dependencies
        run: pip install -e ".[dev]"

      - name: Run non-Blender functional tests
        run: pytest --tb=short -q

  coverage:
    name: Coverage inherited baseline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with development dependencies
        run: pip install -e ".[dev]"

      - name: Run coverage report
        run: pytest --tb=short -q --cov=seidr_smidja --cov-report=term-missing
