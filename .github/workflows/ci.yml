name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff inherited baseline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with development dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check src/ tests/

  typecheck:
    name: mypy inherited baseline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with development dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/seidr_smidja/

  test:
    name: pytest Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with development dependencies
        run: pip install -e ".[dev]"

      - name: Run non-Blender functional tests
        run: pytest --tb=short -q

  coverage:
    name: Coverage inherited baseline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with development dependencies
        run: pip install -e ".[dev]"

      - name: Run coverage report
        run: pytest --tb=short -q --cov=seidr_smidja --cov-report=term-missing
